<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request Sent | Light of Crete</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://lightofcrete.com/success.html" />
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f8f5ef;
        color: #222;
        font-family: "Avenir Next", "SF Pro Display", Inter, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(90vw, 620px);
        padding: 48px;
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.74);
        box-shadow: 0 28px 80px rgba(74, 81, 64, 0.16);
        text-align: center;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 2rem;
      }

      @media (min-width: 720px) {
        h1 {
          font-size: 4rem;
        }
      }

      p {
        margin: 0 0 28px;
        color: #4a5140;
        line-height: 1.6;
      }

      a {
        color: #222;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-25X9V0E94M"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-25X9V0E94M');

      // Η φόρμα κάνει redirect εδώ ΜΟΝΟ μετά από επιτυχή υποβολή στο Netlify,
      // οπότε αυτή η σελίδα είναι η αξιόπιστη στιγμή για τη μετατροπή.
      gtag('event', 'contact_form_submit', {
        event_category: 'lead',
        lead_source: 'contact_form_submit',
      });
      gtag('event', 'generate_lead', {
        event_category: 'lead',
        lead_source: 'contact_form_submit',
      });
    </script>
  </head>
  <body>
    <main>
      <h1>Thank you.</h1>
