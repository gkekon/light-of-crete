<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio · Light of Crete</title>
    <style>
      :root {
        --bg: #f8f5ef;
        --card: #ffffff;
        --ink: #222222;
        --muted: #6f6a60;
        --line: rgba(74, 81, 64, 0.16);
        --olive: #4a5140;
        --sand: #e8dcc8;
        --gold: #b08d57;
        --danger: #a4452f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      }
      button, input { font: inherit; color: inherit; }
      button { cursor: pointer; }

      header {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 20px;
        padding: 14px 24px;
        border-bottom: 1px solid var(--line);
        background: rgba(248, 245, 239, 0.92);
        backdrop-filter: blur(14px);
      }
      header h1 { margin: 0 auto 0 0; font-size: 1.05rem; font-weight: 650; }
      header h1 small { display: block; color: var(--muted); font-size: 0.78rem; font-weight: 400; }

      .segmented { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--sand); }
      .segmented button {
        border: 0;
        border-radius: 999px;
        padding: 7px 15px;
        background: transparent;
        font-weight: 600;
        font-size: 0.86rem;
      }
      .segmented button[aria-pressed='true'] { background: var(--card); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12); }

      .btn {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 17px;
        background: var(--card);
        font-weight: 600;
        font-size: 0.86rem;
      }
      .btn.primary { border-color: var(--olive); background: var(--olive); color: #fff; }
      .btn:disabled { opacity: 0.5; cursor: default; }

      #status { min-width: 9rem; color: var(--muted); font-size: 0.82rem; text-align: right; }
      #status.error { color: var(--danger); }

      .hint { margin: 0 0 18px; color: var(--muted); font-size: 0.86rem; }

      #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
      .card {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
        cursor: grab;
        transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      }
      .card.dragging { opacity: 0.35; }
      .card.drop-before { box-shadow: -4px 0 0 var(--gold); }
      .card.drop-after { box-shadow: 4px 0 0 var(--gold); }
      .card img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; pointer-events: none; }
      .card .order {
        position: absolute;
        top: 8px;
        left: 8px;
        min-width: 26px;
        border-radius: 999px;
        padding: 2px 8px;
        background: rgba(34, 34, 34, 0.72);
        color: #fff;
        font-size: 0.74rem;
        font-weight: 700;
        text-align: center;
      }
      .card .badges { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
      .card .badge { border-radius: 999px; padding: 2px 8px; background: var(--gold); color: #fff; font-size: 0.7rem; font-weight: 700; }
      .card .body { padding: 9px 10px 10px; }
      .card input[type='text'] {
        width: 100%;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 4px 6px;
        background: var(--bg);
        font-size: 0.82rem;
      }
      .card input[type='text']:focus { border-color: var(--gold); outline: none; background: #fff; }
      .card select {
        width: 100%;
        margin-top: 6px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 4px 6px;
        background: #fff;
        font: inherit;
        font-size: 0.8rem;
      }
      .card select.empty { color: var(--muted); }
      #categories { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 18px; }
      #categories label { color: var(--muted); font-size: 0.86rem; }
      #categories input {
        flex: 1 1 320px;
        max-width: 560px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 7px 10px;
        background: #fff;
      }
      .card .actions { display: flex; gap: 4px; margin-top: 7px; }
      .card .actions button {
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 4px 2px;
        background: #fff;
        font-size: 0.72rem;
        font-weight: 600;
      }
      .card .actions button[aria-pressed='true'] { border-color: var(--gold); background: var(--sand); }
      .card .actions .remove { flex: 0 0 30px; color: var(--danger); }
      .card .actions .remove[data-armed='true'] { flex: 1; border-color: var(--danger); }
      #publish[data-armed='true'] { border-color: var(--gold); background: var(--gold); }

      main { height: calc(100vh - var(--header, 64px)); padding: 0; overflow: hidden; }
      #split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: 100%; }
      #order { overflow-y: auto; padding: 20px 20px 80px 24px; }
      #preview { display: flex; flex-direction: column; min-width: 0; border-left: 1px solid var(--line); background: #ece7dc; }
      #devices { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px; }
      #devices small { color: var(--muted); }
      #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; margin: 0 14px 14px; }
      #stage iframe {
        position: absolute;
        top: 0;
        left: 0;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
        transform-origin: top left;
      }
      body[data-view='list'] #split,
      body[data-view='preview'] #split { grid-template-columns: minmax(0, 1fr); }
      body[data-view='list'] #preview,
      body[data-view='preview'] #order { display: none; }
      body[data-view='split'] #grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }

      #drop {
        position: fixed;
        inset: 12px;
        z-index: 20;
        display: none;
        place-items: center;
        border: 3px dashed var(--gold);
        border-radius: 24px;
        background: rgba(248, 245, 239, 0.9);
        font-size: 1.3rem;
        font-weight: 650;
        pointer-events: none;
      }
      body.dropping #drop { display: grid; }
    </style>
  </head>
  <body data-view="split">
    <header>
      <h1>Portfolio<small id="count"></small></h1>
      <div class="segmented" id="views">
        <button type="button" data-view="split" aria-pressed="true">Μαζί</button>
        <button type="button" data-view="list" aria-pressed="false">Λίστα</button>
        <button type="button" data-view="preview" aria-pressed="false">Προεπισκόπηση</button>
      </div>
      <div class="segmented" id="styles" aria-label="Στυλ"></div>
      <button class="btn" type="button" id="add">+ Φωτογραφίες</button>
      <input id="files" type="file" accept="image/*" multiple hidden />
      <button class="btn primary" type="button" id="publish">Δημοσίευση</button>
      <span id="status"></span>
    </header>

    <main>
      <div id="split">
      <section id="order">
        <p class="hint">
          Σύρε τις φωτογραφίες για να αλλάξεις τη σειρά — εδώ ή απευθείας μέσα στην προεπισκόπηση. Ρίξε αρχεία οπουδήποτε στη σελίδα για να προσθέσεις νέες.
          Το «Μεγάλη» μετράει στο στυλ Editorial· η «Λεζάντα» εμφανίζεται όταν περνά το ποντίκι πάνω από τη φωτογραφία.
        </p>
        <div id="categories">
          <label for="categoryList">Κατηγορίες (με κόμμα):</label>
          <input id="categoryList" type="text" placeholder="Couples, Family, Maternity, Solo" />
        </div>
        <div id="grid"></div>
      </section>
      <section id="preview">
        <div id="devices">
          <div class="segmented" id="deviceButtons">
            <button type="button" data-width="390" aria-pressed="false">Κινητό</button>
            <button type="button" data-width="820" aria-pressed="false">Tablet</button>
            <button type="button" data-width="1280" aria-pressed="true">Desktop</button>
          </div>
          <small id="deviceInfo"></small>
        </div>
        <div id="stage"><iframe title="Προεπισκόπηση" src="http://127.0.0.1:__PREVIEW_PORT__/gallery"></iframe></div>
      </section>
      </div>
    </main>

    <div id="drop">Άφησε τις φωτογραφίες εδώ</div>

    <script type="module">
      const STYLE_LABELS = { editorial: 'Editorial', masonry: 'Masonry', justified: 'Justified' };
      const els = Object.fromEntries(
        ['grid', 'count', 'styles', 'views', 'add', 'files', 'publish', 'status', 'categoryList'].map((id) => [id, document.getElementById(id)])
      );
      const iframe = document.querySelector('#stage iframe');
      const stage = document.getElementById('stage');
      const PREVIEW_ORIGIN = new URL(iframe.src).origin;
      let deviceWidth = 1280;
      let portfolio = { style: 'editorial', heroImage: '', items: [] };
      let git = { unsaved: 0, unpushedCommits: 0 };
      let dragId = null;
      let saveTimer = null;

      async function api(path, options = {}) {
        const response = await fetch(path, options);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || `Σφάλμα ${response.status}`);
        return data;
      }

      // Native confirm() dialogs are blocked in some embedded browsers, so a
      // risky button asks for a second click instead.
      function confirmClick(button, armedText, action) {
        const idleText = button.textContent;
        let timer = null;
        const disarm = () => {
          clearTimeout(timer);
          button.dataset.armed = '';
          button.textContent = idleText;
        };
        button.addEventListener('click', () => {
          if (button.dataset.armed === 'true') {
            disarm();
            action();
            return;
          }
          button.dataset.armed = 'true';
          button.textContent = armedText;
          timer = setTimeout(disarm, 4000);
        });
      }

      function setStatus(text, error = false) {
        els.status.textContent = text;
        els.status.classList.toggle('error', error);
      }

      function pendingText() {
        const parts = [];
        if (git.unsaved) parts.push('αλλαγές που δεν έχουν δημοσιευτεί');
        else if (git.unpushedCommits) parts.push('έτοιμο για δημοσίευση');
        return parts[0] || 'Δημοσιευμένο';
      }

      function pushPreview() {
        iframe.contentWindow?.postMessage({ type: 'loc-portfolio', portfolio }, PREVIEW_ORIGIN);
      }

      // The preview is a real browser viewport of the chosen width, scaled down to fit the pane.
      function layoutPreview() {
        const paneWidth = stage.clientWidth;
        const paneHeight = stage.clientHeight;
        if (!paneWidth || !paneHeight) return;
        const scale = Math.min(1, paneWidth / deviceWidth);
        iframe.style.width = `${deviceWidth}px`;
        iframe.style.height = `${paneHeight / scale}px`;
        iframe.style.transform = `scale(${scale})`;
        iframe.style.left = `${Math.max(0, (paneWidth - deviceWidth * scale) / 2)}px`;
        document.getElementById('deviceInfo').textContent = `${deviceWidth}px · ${Math.round(scale * 100)}%`;
      }

      function moveItem(dragId, targetId, before) {
        const moved = portfolio.items.find((other) => other.id === dragId);
        const rest = portfolio.items.filter((other) => other.id !== dragId);
        const target = rest.findIndex((other) => other.id === targetId);
        if (!moved || target < 0) return;
        rest.splice(before ? target : target + 1, 0, moved);
        portfolio.items = rest;
        render();
        save();
      }

      async function save() {
        pushPreview();
        try {
          const data = await api('/api/portfolio', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(portfolio),
          });
          // The cards hold references to these item objects, so they are not replaced.
          git = data.git;
          setStatus(`Αποθηκεύτηκε · ${pendingText()}`);
        } catch (error) {
          setStatus(error.message, true);
        }
      }

      // Typing in a caption should not write the file on every keystroke.
      function saveSoon() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(save, 500);
      }

      function renderStyles(styles) {
        els.styles.replaceChildren(
          ...styles.map((style) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = STYLE_LABELS[style] || style;
            button.setAttribute('aria-pressed', String(portfolio.style === style));
            button.addEventListener('click', () => {
              portfolio.style = style;
              renderStyles(styles);
              save();
            });
            return button;
          })
        );
      }

      function card(item, index) {
        const element = document.createElement('div');
        element.className = 'card';
        element.draggable = true;
        element.dataset.id = item.id;

        const img = document.createElement('img');
        img.src = item.src;
        img.loading = 'lazy';
        img.alt = '';

        const order = document.createElement('span');
        order.className = 'order';
        order.textContent = index + 1;

        const badges = document.createElement('div');
        badges.className = 'badges';
        if (portfolio.heroImage === item.src) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = 'Εξώφυλλο';
          badges.append(badge);
        }

        const body = document.createElement('div');
        body.className = 'body';

        const label = document.createElement('input');
        label.type = 'text';
        label.placeholder = 'Λεζάντα (προαιρετική)';
        label.value = item.label;
        label.addEventListener('input', () => {
          item.label = label.value;
          pushPreview();
          saveSoon();
        });
        // Dragging from inside the text field would move the card instead of selecting text.
        label.addEventListener('mousedown', () => (element.draggable = false));
        label.addEventListener('blur', () => (element.draggable = true));

        const category = document.createElement('select');
        category.append(new Option('Χωρίς κατηγορία', ''), ...(portfolio.categories || []).map((entry) => new Option(entry.label, entry.id)));
        category.value = item.category || '';
        category.classList.toggle('empty', !category.value);
        category.addEventListener('change', () => {
          item.category = category.value;
          category.classList.toggle('empty', !category.value);
          save();
        });

        const actions = document.createElement('div');
        actions.className = 'actions';

        const large = document.createElement('button');
        large.type = 'button';
        large.textContent = 'Μεγάλη';
        large.setAttribute('aria-pressed', String(item.large));
        large.addEventListener('click', () => {
          item.large = !item.large;
          render();
          save();
        });

        const hero = document.createElement('button');
        hero.type = 'button';
        hero.textContent = 'Εξώφυλλο';
        hero.setAttribute('aria-pressed', String(portfolio.heroImage === item.src));
        hero.addEventListener('click', () => {
          portfolio.heroImage = item.src;
          render();
          save();
        });

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'remove';
        remove.textContent = '✕';
        remove.title = 'Αφαίρεση από το portfolio (το αρχείο μένει στον δίσκο)';
        confirmClick(remove, 'Σίγουρα;', () => {
          portfolio.items = portfolio.items.filter((other) => other.id !== item.id);
          render();
          save();
        });

        actions.append(large, hero, remove);
        body.append(label, category, actions);
        element.append(img, order, badges, body);

        element.addEventListener('dragstart', (event) => {
          dragId = item.id;
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', item.id);
          requestAnimationFrame(() => element.classList.add('dragging'));
        });
        element.addEventListener('dragend', () => {
          dragId = null;
          document.querySelectorAll('.card').forEach((other) => other.classList.remove('dragging', 'drop-before', 'drop-after'));
        });
        element.addEventListener('dragover', (event) => {
          if (!dragId || dragId === item.id) return;
          event.preventDefault();
          const box = element.getBoundingClientRect();
          const before = event.clientX < box.left + box.width / 2;
          element.classList.toggle('drop-before', before);
          element.classList.toggle('drop-after', !before);
        });
        element.addEventListener('dragleave', () => element.classList.remove('drop-before', 'drop-after'));
        element.addEventListener('drop', (event) => {
          if (!dragId || dragId === item.id) return;
          event.preventDefault();
          moveItem(dragId, item.id, element.classList.contains('drop-before'));
        });

        return element;
      }

      function render() {
        els.count.textContent = `${portfolio.items.length} φωτογραφίες`;
        els.grid.replaceChildren(...portfolio.items.map(card));
      }

      async function upload(files) {
        const images = [...files].filter((file) => file.type.startsWith('image/') || /\.(jpe?g|png|tiff?|webp|heic)$/i.test(file.name));
        if (!images.length) return;
        els.add.disabled = true;
        let done = 0;
        const failed = [];
        for (const file of images) {
          setStatus(`Ανεβαίνει ${done + 1}/${images.length}…`);
          try {
            const data = await api(`/api/upload?name=${encodeURIComponent(file.name)}`, { method: 'POST', body: file });
            portfolio.items.push(data.item);
          } catch {
            failed.push(file.name);
          }
          done += 1;
        }
        els.add.disabled = false;
        render();
        await save();
        if (failed.length) setStatus(`Δεν διαβάστηκαν: ${failed.join(', ')}`, true);
      }

      const slugify = (value) =>
        value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

      // Renaming keeps a category's photos when the position in the list stays the same.
      els.categoryList.addEventListener('change', async () => {
        const labels = els.categoryList.value.split(',').map((label) => label.trim()).filter(Boolean);
        const previous = portfolio.categories || [];
        const next = labels.map((label) => ({ id: slugify(label), label }));
        const renamed = new Map();
        if (next.length === previous.length) previous.forEach((entry, index) => renamed.set(entry.id, next[index].id));
        portfolio.items.forEach((item) => {
          if (renamed.has(item.category)) item.category = renamed.get(item.category);
        });
        portfolio.categories = next;
        await save();
        renderCategories();
        render();
      });

      function renderCategories() {
        els.categoryList.value = (portfolio.categories || []).map((entry) => entry.label).join(', ');
      }

      els.add.addEventListener('click', () => els.files.click());
      els.files.addEventListener('change', () => {
        upload(els.files.files);
        els.files.value = '';
      });

      // Files dragged in from Finder (card drags carry no files).
      const hasFiles = (event) => [...(event.dataTransfer?.types || [])].includes('Files');
      window.addEventListener('dragover', (event) => {
        if (!hasFiles(event)) return;
        event.preventDefault();
        document.body.classList.add('dropping');
      });
      window.addEventListener('dragleave', (event) => {
        if (!event.relatedTarget) document.body.classList.remove('dropping');
      });
      window.addEventListener('drop', (event) => {
        if (!hasFiles(event)) return;
        event.preventDefault();
        document.body.classList.remove('dropping');
        upload(event.dataTransfer.files);
      });

      els.views.addEventListener('click', (event) => {
        const view = event.target.dataset?.view;
        if (!view) return;
        document.body.dataset.view = view;
        els.views.querySelectorAll('button').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
        layoutPreview();
      });

      document.getElementById('deviceButtons').addEventListener('click', (event) => {
        const width = Number(event.target.dataset?.width);
        if (!width) return;
        deviceWidth = width;
        event.currentTarget.querySelectorAll('button').forEach((button) => button.setAttribute('aria-pressed', String(button === event.target)));
        layoutPreview();
      });

      window.addEventListener('message', (event) => {
        if (event.origin !== PREVIEW_ORIGIN) return;
        if (event.data?.type === 'loc-portfolio-ready') pushPreview();
        if (event.data?.type === 'loc-portfolio-reorder') moveItem(event.data.dragId, event.data.targetId, event.data.before);
      });

      const fitHeader = () => document.documentElement.style.setProperty('--header', `${document.querySelector('header').offsetHeight}px`);
      new ResizeObserver(() => {
        fitHeader();
        layoutPreview();
      }).observe(document.body);

      confirmClick(els.publish, 'Πάτα ξανά για δημοσίευση', async () => {
        els.publish.disabled = true;
        setStatus('Δημοσίευση…');
        try {
          clearTimeout(saveTimer);
          await save();
          const data = await api('/api/publish', { method: 'POST' });
          git = data.git;
          setStatus('Στάλθηκε · ζωντανό σε 1–2 λεπτά');
        } catch (error) {
          setStatus(error.message, true);
        } finally {
          els.publish.disabled = false;
        }
      });

      const data = await api('/api/portfolio');
      portfolio = data.portfolio;
      git = data.git;
      renderStyles(data.styles);
      renderCategories();
      render();
      fitHeader();
      layoutPreview();
      pushPreview();
      setStatus(pendingText());
    </script>
  </body>
</html>
