    <!-- LIGHT OF CRETE CINEMATIC PRELOADER -->
    <div id="loc-preloader" class="loc-preloader">
      <!-- 1. Base warm plaster/paper background texture -->
      <div class="preloader-bg"></div>

      <!-- 3. Warm sunlight gradient layer (Placed behind logo for realistic lighting bleed) -->
      <div class="sunlight-beam"></div>

      <!-- 4. Soft organic leaf shadow layer -->
      <div class="leaf-shadows">
        <!-- Inline organic SVG paths to mimic real leaves without loading external assets -->
        <svg viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M-50,100 Q100,80 180,200 Q220,320 120,400 Q20,480 -20,350 Z" fill="currentColor" />
          <path d="M120,-50 Q280,20 310,180 Q340,300 200,380 Q100,320 80,150 Z" fill="currentColor" />
          <path d="M300,150 Q450,100 520,220 Q550,350 400,420 Q300,380 280,250 Z" fill="currentColor" />
          <path d="M50,400 Q180,380 250,480 Q300,580 180,650 Q80,600 30,480 Z" fill="currentColor" />
        </svg>
      </div>

      <!-- 2. Logo Layer (Centered, elegant, and clean) -->
      <div class="preloader-logo-wrap">
        <!-- Cleaned SVG Logo (No camera icon) -->
        <svg class="preloader-logo" viewBox="0 0 500 220" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Sun and Sea Emblem -->
          <path d="M250,20 C215,20 185,45 180,80 C180,80 250,80 250,80 Z" stroke="#bfa37a" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M190,80 C195,55 220,35 250,35 C280,35 305,55 310,80" stroke="#bfa37a" stroke-width="1.2"/>

          <line x1="225" y1="40" x2="242" y2="72" stroke="#bfa37a" stroke-width="1"/>
          <line x1="205" y1="52" x2="235" y2="75" stroke="#bfa37a" stroke-width="1"/>
          <line x1="195" y1="70" x2="230" y2="78" stroke="#bfa37a" stroke-width="1"/>
          <line x1="275" y1="40" x2="258" y2="72" stroke="#bfa37a" stroke-width="1"/>
          <line x1="295" y1="52" x2="265" y2="75" stroke="#bfa37a" stroke-width="1"/>
          <line x1="305" y1="70" x2="270" y2="78" stroke="#bfa37a" stroke-width="1"/>
          <!-- Sea Horizon Lines -->

    <style>
      /* --- PRELOADER STYLES --- */
      :root {
        --cinematic-ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      .loc-preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        z-index: 99999;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        pointer-events: all;
        background-color: #e6e2db;
      }

      .preloader-bg {
        position: absolute;
        inset: 0;
        background-color: #ebe7e0;
        background-image: radial-gradient(rgba(0, 0, 0, 0.015) 1px, transparent 0);
        background-size: 4px 4px;
        z-index: 1;
      }

      .preloader-logo-wrap {
        position: relative;
        z-index: 3;
        width: 90%;
        max-width: 500px;
        opacity: 0;
        filter: blur(4px);
        transform: scale(0.98);
        animation: fadeInLogo 1.4s var(--cinematic-ease) forwards;
        animation-delay: 0.2s;
      }

      .preloader-logo {
        width: 100%;
        height: auto;
        display: block;
      }

      .sunlight-beam {
        position: absolute;
        top: -50%;
        left: -60%;
        width: 120%;
        height: 200%;
        z-index: 2;
        background: radial-gradient(
          ellipse at center,
          rgba(255, 228, 185, 0.38) 0%,
          rgba(255, 218, 160, 0.18) 45%,
          rgba(235, 231, 224, 0) 70%
        );
        filter: blur(80px);
        transform: rotate(-15deg);
        pointer-events: none;
        animation: sunlightPass 6.2s cubic-bezier(0.3, 0.05, 0.35, 1) forwards;
      }

      .leaf-shadows {
        position: absolute;
        inset: -20%;
        z-index: 4;
        color: #3a3732;
        opacity: 0.16;
        filter: blur(45px);
        mix-blend-mode: multiply;
        pointer-events: none;
        transform-origin: 30% 30%;
        animation: leafMove 6.2s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
      }

      @keyframes fadeInLogo {
        0% {
          opacity: 0;
          filter: blur(6px);
          transform: scale(0.97);
        }
        100% {
          opacity: 1;
          filter: blur(0px);
          transform: scale(1);
        }
      }

      @keyframes sunlightPass {
        0% {
          transform: translate(-30%, -10%) rotate(-15deg) scale(0.9);
        }
        100% {
          transform: translate(105%, 5%) rotate(-10deg) scale(1.1);
        }
      }

      @keyframes leafMove {
        0% {
          transform: translate(-8%, -4%) rotate(-4deg) scale(0.95);
          opacity: 0.12;
        }
        50% {
          opacity: 0.19;
        }
        100% {
          transform: translate(12%, 6%) rotate(3deg) scale(1.05);
          opacity: 0.14;
        }
      }

      .main-site-content {
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 1.7s var(--cinematic-ease), transform 1.7s var(--cinematic-ease);
      }

      .main-site-content.reveal-site {
        opacity: 1;
        transform: translateY(0px);
      }

      .loc-preloader.fade-out-preloader {
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.5s var(--cinematic-ease);
      }

      @media (prefers-reduced-motion: reduce) {
        .loc-preloader {
          display: none !important;
        }
        .main-site-content {
          opacity: 1 !important;
          transform: translateY(0) !important;
        }
      }

      .instant-site .loc-preloader {
        display: none !important;
      }

      .instant-site .main-site-content {
        opacity: 1 !important;
        transform: translateY(0) !important;
      }
    </style>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const preloader = document.getElementById("loc-preloader");
        const mainContent = document.querySelector(".main-site-content");
        const forceIntro = new URLSearchParams(window.location.search).get("intro") === "1";

        if (!forceIntro && sessionStorage.getItem("loc_intro_played") === "true") {
          document.documentElement.classList.add("instant-site");
          if (preloader) preloader.style.display = "none";
          if (mainContent) mainContent.classList.add("reveal-site");
          return;
        }

        setTimeout(function () {
          if (preloader) {
            preloader.classList.add("fade-out-preloader");
          }
          if (mainContent) {
            mainContent.classList.add("reveal-site");
          }
          sessionStorage.setItem("loc_intro_played", "true");
        }, 4500);

        setTimeout(function () {
          if (preloader && preloader.parentNode) {
            preloader.parentNode.removeChild(preloader);
          }
        }, 6500);
      });
    </script>

    <form
      name="photoshoot-request"

      <input name="people" />
      <textarea name="message"></textarea>
    </form>
    <div id="root" class="main-site-content"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
